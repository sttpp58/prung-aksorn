name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Ensure Chromium-family browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled Google Chrome"
          elif command -v chromium >/dev/null 2>&1; then
            echo "Using preinstalled Chromium"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled chromium-browser"
          else
            sudo apt-get update
            sudo apt-get install -y chromium
          fi

      - name: Run Browser E2E
        run: node tests/e2e/browser-real-user-scenario.mjs
